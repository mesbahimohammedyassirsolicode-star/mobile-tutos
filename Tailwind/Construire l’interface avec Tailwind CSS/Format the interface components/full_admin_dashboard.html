<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- this is the container -->
    <div class="flex min-h-screen">
        <!-- aside section -->
        <aside class="bg-gray-800 text-white p-6 w-64 flex flex-col  text-center shadow" >
            <div class="border-gray-500  border-b pb-3 ">
                <h1 class="text-xl font-bold mb-1">admin</h1>
                <p class="text-xs text-gray-300 ">mon blog</p>
            </div>
            <nav class="pt-5 flex flex-col gap-1">
                <a href="#" class="px-5 py-3 rounded-lg hover:bg-gray-700 text-gray-300 hover:text-gray-100 ransition-colors active:bg-blue-600 text-white rounded-lg">tableau de bord</a>
                <a href="#" class="px-5 py-3 rounded-lg hover:bg-gray-700 text-gray-300 hover:text-gray-100 ransition-colors active:bg-blue-600 text-white rounded-lg" >articles</a>
                <a href="#" class="px-5 py-3 rounded-lg hover:bg-gray-700 text-gray-300 hover:text-gray-100 ransition-colors active:bg-blue-600 text-white rounded-lg">category</a>
            </nav>
        </aside>
        <!-- body main section -->
        <div class="flex flex flex-col w-full ">
            <header class="flex justify-between border-b border-gray-200 flex items-center px-3 py-2 shadow-sm">
                <h1 class="text-lg font-bold text-gray-800">Gestion des catégories</h1>
                <p class="text-sm font-meduim rounded-full text-gray-400 bg-gray-200 px-4 py-2 ">admin</p>
            </header>
            <main class="flex-1 ">
                <div class="max-w-5xl mx-auto space-y-6">
                    <section class="flex items-center justify-between">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800">Catégories</h2>
                            <p class="text-gray-500 text-sm mt-1">Organisez les rubriques de votre blog.</p>
                        </div>
                        <button type="button" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors">
                            + Nouvelle Catégorie
                        </button>
                    </section>
                    <section class="bg-white rounded-xl shadow-sm p-6 space-y-4">
                        <h3 class="text-lg font-semibold text-gray-700 border-b pb-3">Ajouter / Modifier</h3>
                        <form class="space-y-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Nom</label>
                                <input type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Exmple: Développement Web">
                            </div>
                            <div class="flex gap-3">
                                <button type="button" class="flex-1 bg-gray-100 text-gray-600 py-2 rounded-lg text-sm hover:bg-gray-200 transition-colors">Annuler</button>
                                <button type="submit" class="flex-1 bg-blue-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors">Enregistrer</button>
                            </div>
                        </form>
                    </section>
                    <section class="bg-white rounded-xl shadow-sm p-6 space-y-4">
                        <h3 class="text-lg font-semibold text-gray-700 border-b pb-3">List Category</h3>
                        <table class="w-full text-sm">
                            <thead class="bg-gray-50">
                                <th class="text-left text-xs text-gray-500 uppercase px-6 py-3">ID</th>
                                <th class="text-left text-xs text-gray-500 uppercase px-6 py-3">Nom</th>
                                <th class="text-left text-xs text-gray-500 uppercase px-6 py-3">Couleur</th>
                                <th class="text-left text-xs text-gray-500 uppercase px-6 py-3">Actions</th>
                            </thead>
                            <tbody class="divide-y divide-gray-200">
                                <tr class="hover:bg-gray-100">
                                    <td class="px-6 py-4 text-gray-500">#1</td>
                                    <td class="px-6 py-4 font-medium text-gray-800">#1</td>
                                    <td class="px-6 py-4 font-medium text-gray-800"><span class="bg-blue-100 text-blue-700 px-2 py-1 rounded-full text-xs">Bleu</span></td>
                                    <td class="px-6 py-4 font-medium text-gray-800 ">
                                        <button class="text-blue-600 hover:underline text-xs mx-2">Éditer</button>
                                        <button class="text-red-500 hover:underline text-xs mx-2">Supprimer</button>
                                    </td>
                                   
                                </tr>

                            </tbody>
                        </table>
                        
                    
                    </section>
                    
                    
                </div>

            </main>
            
        </div>

    </div>
    
</body>
</html>
