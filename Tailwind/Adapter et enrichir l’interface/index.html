
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="flex flex-col md:flex-row min-h-screen">
        <aside class="hidden md:flex w-64 bg-gray-400 text-white flex-col p-3 text-center">
            <h2 class="my-5 font-bold text-2xl">GESTION</h2>
            <nav class="pt-5 flex flex-col">
                <a href="#" class="text-lg p-3 bg-gray-300 rounded-xl">blog</a>
            </nav>
        </aside>

        <div class="flex flex-col flex-1 min-w-0">
            <header class="flex justify-between p-4 bg-gray-100 border border-b">
                <h2 class="px-3">gestion de articles</h2>
                <span class="px-3">admin</span>
            </header>

            <main class="flex flex-col p-3 md:p-6">
                <section class="flex flex-col md:flex-row md:justify-between md:items-center min-h-36 text-center my-3 gap-4">
                    <div class="w-full md:w-64">
                        <h2 class="mb-4 md:mb-12 font-bold text-2xl">article</h2>
                        <p>the articles that u want</p>
                    </div>
                    <button class="bg-blue-400 p-4 rounded h-14 bg-blue-600 text-white py-2 rounded-lg">
                        ajouter article
                    </button>
                </section>

                <section class="w-full bg-gray-100 space-y-4 p-4">
                    <h3 class="text-lg font-semibold text-gray-700 pb-3">Ajouter / Modifier</h3>
                    <form id="form-thematique" class="space-y-4">
                        <input type="text" placeholder="nom categorie" name="nom" id="nom_thematique" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">

                        <div class="flex items-center justify-between rounded-lg border border-gray-300 bg-white px-4 py-2 focus-within:ring-2 focus-within:ring-blue-500">
                            <label for="couleur" class="text-sm font-medium text-gray-700">Couleur de la catégorie</label>
                            <div class="flex items-center gap-3">
                                <span id="couleur-value" class="font-mono text-sm uppercase text-gray-500">#3B82F6</span>
                                <input type="color" name="couleur" id="couleur" value="#3B82F6" required class="h-10 w-14 cursor-pointer rounded-lg border border-gray-200 bg-white p-1">
                            </div>
                        </div>

                        <input type="text" placeholder="icone (ex: 💻)" name="icone" id="icone" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">

                        <div class="flex flex-col sm:flex-row gap-3 p-5">
                            <button type="button" class="flex-1 bg-gray-200 text-gray-600 py-2 rounded-lg text-sm hover:bg-gray-300 transition-colors">Annuler</button>
                            <button type="submit" id="btnSubmit" class="flex-1 bg-blue-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors">Enregistrer</button>
                        </div>
                    </form>
                </section>

                <section class="bg-white rounded shadow-sm overflow-hidden mt-4">
                    <h3 class="text-lg font-semibold text-gray-700 p-6 border-b">list categories</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="text-left text-xs text-gray-500 uppercase px-6 py-3">id</th>
                                    <th class="text-left text-xs text-gray-500 uppercase px-6 py-3">nom</th>
                                    <th class="text-left text-xs text-gray-500 uppercase px-6 py-3">couleur</th>
                                    <th class="text-left text-xs text-gray-500 uppercase px-6 py-3">icone</th>
                                </tr>
                            </thead>
                            <tbody id="table-thematiques-body" class="divide-y divide-gray-10">
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div id="toast-container" class="fixed top-5 right-5 z-50 space-y-3"></div>
    <script src="/frontend/assets/js/app.js"></script>
</body>
</html>
